name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/TUIKit.sln

      - name: Build
        run: dotnet build src/TUIKit.sln --no-restore --configuration Release

      - name: Run console tests
        run: dotnet run --project src/Test.Automated --framework net8.0 --configuration Release -- --results results.json

      - name: Run xUnit tests
        run: dotnet test src/Test.Xunit --configuration Release

      - name: Run NUnit tests
        run: dotnet test src/Test.Nunit --configuration Release

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.json

  fx-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build library (all target frameworks incl. netstandard2.0)
        run: dotnet build src/TUIKit/TUIKit.csproj --configuration Release
